name: Tjek server (midlertidig)
on:
  push:
    branches: [test-conventus-login]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          U=https://rbsuittqekgaudmstpqu.supabase.co/functions/v1/hoebk
          echo "VERSION: $(curl -sS -m 30 "$U?action=version")"
          for q in an han x; do
            echo "SOEG[$q]: $(curl -sS -m 30 -H 'Content-Type: text/plain' -d "{\"action\":\"memberSearch\",\"q\":\"$q\"}" $U | python3 -c 'import sys,json;d=json.load(sys.stdin);m=d.get("members",[]);print(d.get("ok"),len(m),"træf; felter:",sorted(m[0].keys()) if m else "-")')"
          done
          echo "MEMBERS-UDEN-LOGIN: $(curl -sS -m 30 -H 'Content-Type: text/plain' -d '{"action":"members","token":"x"}' $U)"
