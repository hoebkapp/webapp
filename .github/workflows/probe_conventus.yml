name: Tjek server (midlertidig)
on:
  push:
    branches: [test-conventus-login]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          U=https://rbsuittqekgaudmstpqu.supabase.co/functions/v1/hoebk
          echo "VERSION: $(curl -sS -m 30 "$U?action=version" | head -c 60)"
          echo "SIGNUP: $(curl -sS -m 30 -H 'Content-Type: text/plain' -d '{"action":"convSignup"}' $U | python3 -c 'import sys,json;d=json.load(sys.stdin);g=d.get("groups",[]);print(d.get("ok"),len(g),"grupper ·",[x["title"][:28]+("@"+x["from"] if x["from"] else "") for x in g if "inton" in x["title"].lower() or x["from"]])')"
